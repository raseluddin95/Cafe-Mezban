<!-- OPTIMIZED VERSION START -->
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Mezban | Optimized Menu</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --bg:#0a192f;
    --card:rgba(10,25,47,0.75);
    --coral:#FF7F50;
    --text:#f5f5f7;
    --muted:#b0c4de;
    --border:rgba(255,127,80,0.2);
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

header{
    padding:18px;
    text-align:center;
    font-weight:bold;
    background:#081426;
}

/* TABS */
.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    padding:10px;
}

.tab{
    padding:8px 14px;
    background:#13243f;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
}

.tab.active{
    background:var(--coral);
    color:#000;
}

/* GRID */
.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
    padding:10px;
}

/* CARD */
.card{
    background:var(--card);
    border-radius:10px;
    overflow:hidden;
    text-align:center;
}

.card img{
    width:100%;
    height:120px;
    object-fit:cover;
    background:#222;
}

.name{font-size:13px;margin:5px 0;}
.price{color:var(--coral);font-weight:bold;margin-bottom:8px;}

.loading{
    text-align:center;
    padding:20px;
    color:var(--muted);
}
</style>
</head>

<body>

<header>Cafe Mezban Menu</header>

<div class="tabs" id="tabs"></div>
<div class="menu" id="menu"><div class="loading">Loading...</div></div>

<script>
const apiURL = "https://script.google.com/macros/s/AKfycbyT41VoOjiJz0o-XQGevUUNwe4azoTyMskOKQsgbJN6OJol02WHkJR-HsRF_tW-mY7W/exec";

let ALL_DATA = [];
let CATEGORIES = {};
let CURRENT_CAT = "all";

/* FAST FETCH ONCE */
async function loadData(){
    try{
        const res = await fetch(apiURL);
        const data = await res.json();

        process(data);
        buildTabs();
        render("all");

    }catch(e){
        document.getElementById("menu").innerHTML =
        "<p style='color:red;text-align:center'>Failed to load</p>";
    }
}

/* PROCESS DATA ONCE (OPTIMIZED) */
function process(rows){
    CATEGORIES = { all: [] };

    rows.forEach(r=>{
        const item = {
            name: r.name || r.Name || "No Name",
            price: Number(r.price || r.Price || 0),
            image: r.image || r.Image || "",
            category: (r.category || r.Category || "General").toLowerCase()
        };

        ALL_DATA.push(item);

        if(!CATEGORIES[item.category]){
            CATEGORIES[item.category] = [];
        }

        CATEGORIES[item.category].push(item);
        CATEGORIES.all.push(item);
    });
}

/* BUILD TABS ONCE */
function buildTabs(){
    const tabs = document.getElementById("tabs");

    let html = `<div class="tab active" onclick="render('all')">All</div>`;

    Object.keys(CATEGORIES).forEach(cat=>{
        if(cat !== "all"){
            html += `<div class="tab" onclick="render('${cat}')">${cat}</div>`;
        }
    });

    tabs.innerHTML = html;
}

/* FAST RENDER */
function render(cat){
    CURRENT_CAT = cat;

    document.querySelectorAll(".tab").forEach(t=>{
        t.classList.remove("active");
    });

    event.target.classList.add("active");

    const items = CATEGORIES[cat] || [];

    let html = "";

    for(let i=0;i<items.length;i++){
        const it = items[i];

        html += `
        <div class="card">
            <img src="${it.image}" loading="lazy"
            onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300'">
            <div class="name">${it.name}</div>
            <div class="price">৳${it.price}</div>
        </div>`;
    }

    document.getElementById("menu").innerHTML = html;
}

loadData();
</script>

</body>
</html>
<!-- OPTIMIZED VERSION END -->
